app = "f1-analytics-api"
primary_region = "iad"

[build]

[env]
  PYTHONPATH = "."
  DEFAULT_SEASON = "2026"
  LOG_LEVEL = "INFO"
  OPENF1_API_KEY = ""
  API_SPORTS_KEY = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
